<!DOCTYPE html>
<html lang="zh-Hant" data-theme="day" data-mode="beginner">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>島先生的時間管理日記｜台灣島互動導覽地圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
/* ==========================================================================
   島先生的時間管理日記｜台灣島互動導覽（大字體精簡版）
   支援：白天模式 (day) / 夜間模式 (night) × 初學者 (beginner) / 老鳥模式 (pro)
   ========================================================================== */

:root {
  --bg-top: #d8f3f8;
  --bg-mid: #e9f7f5;
  --bg-bot: #f7f4ea;
  --surface: rgba(255, 255, 255, 0.9);
  --surface-strong: #ffffff;
  --surface-soft: #f2f8f6;
  --border: rgba(22, 125, 141, 0.18);
  --border-strong: rgba(22, 125, 141, 0.36);

  --text-main: #153138;
  --text-muted: #426169;
  --text-soft: #647f86;

  --accent: #167d8d;
  --accent-hover: #10606d;
  --accent-soft: rgba(22, 125, 141, 0.12);
  --warm: #d97736;
  --warm-soft: rgba(217, 119, 54, 0.14);
  --green: #2d8a61;
  --green-soft: rgba(45, 138, 97, 0.13);
  --purple: #6b52ae;
  --purple-soft: rgba(107, 82, 174, 0.13);

  --island-fill: url(#islandGradDay);
  --island-stroke: #1b4332;
  --coast-stroke: rgba(22, 125, 141, 0.35);
  --mountain-stroke: #ffffff;
  --route-color: #d97736;
  --relation-color: #7c3aed;

  --node-bg: #ffffff;
  --node-border: #167d8d;
  --node-active-bg: #fff7ed;
  --node-active-border: #d97736;
  --label-bg: rgba(255, 255, 255, 0.96);
  --label-text: #153138;

  --shadow-sm: 0 4px 14px rgba(16, 62, 74, 0.08);
  --shadow-md: 0 12px 32px rgba(16, 62, 74, 0.12);
  --radius-lg: 22px;
  --radius-md: 14px;
}

html {
  font-size: 18.5px;
}

html[data-theme="night"] {
  --bg-top: #07131d;
  --bg-mid: #0c1f2e;
  --bg-bot: #112a3b;
  --surface: rgba(16, 36, 52, 0.88);
  --surface-strong: #132c40;
  --surface-soft: rgba(255, 255, 255, 0.06);
  --border: rgba(114, 214, 224, 0.2);
  --border-strong: rgba(114, 214, 224, 0.42);

  --text-main: #eef8fa;
  --text-muted: #b0cfd9;
  --text-soft: #88adb9;

  --accent: #4ad0dc;
  --accent-hover: #70dfe9;
  --accent-soft: rgba(74, 208, 220, 0.16);
  --warm: #f5a65b;
  --warm-soft: rgba(245, 166, 91, 0.16);
  --green: #5cd6a0;
  --green-soft: rgba(92, 214, 160, 0.15);
  --purple: #b89aff;
  --purple-soft: rgba(184, 154, 255, 0.16);

  --island-fill: url(#islandGradNight);
  --island-stroke: #4ad0dc;
  --coast-stroke: rgba(74, 208, 220, 0.35);
  --mountain-stroke: #6ee7e7;
  --route-color: #f5a65b;
  --relation-color: #c084fc;

  --node-bg: #0f2536;
  --node-border: #4ad0dc;
  --node-active-bg: #26221c;
  --node-active-border: #f5a65b;
  --label-bg: rgba(12, 31, 46, 0.94);
  --label-text: #eef8fa;

  --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.28);
  --shadow-md: 0 14px 36px rgba(0, 0, 0, 0.42);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text-main);
  background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bot) 100%);
  min-height: 100vh;
  line-height: 1.65;
  transition: background 0.45s ease, color 0.35s ease;
  position: relative;
  overflow-x: hidden;
}

.ocean-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.stars { position: absolute; inset: 0; opacity: 0; transition: opacity 0.6s ease; }
html[data-theme="night"] .stars { opacity: 1; }
.star { position: absolute; border-radius: 50%; background: #ffffff; animation: twinkle 3.6s infinite ease-in-out; }
@keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.9); } 50% { opacity: 0.9; transform: scale(1.25); } }
.wave { position: absolute; left: -10%; width: 120%; height: 180px; border-radius: 50%; opacity: 0.12; background: var(--accent); filter: blur(42px); }
.wave-1 { bottom: -90px; }
.wave-2 { top: -110px; opacity: 0.08; }

.topbar { position: relative; z-index: 10; max-width: 1320px; margin: 0 auto; padding: 20px 24px 10px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-badge { width: 52px; height: 52px; border-radius: 15px; background: var(--surface-strong); border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: grid; place-items: center; font-size: 28px; }
.brand-text h1 { font-size: 1.38rem; font-weight: 900; letter-spacing: 0.02em; line-height: 1.25; }
.brand-sub { font-size: 0.9rem; color: var(--text-muted); }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.segmented-control { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.seg-btn { border: none; background: transparent; color: var(--text-muted); font-family: inherit; font-size: 0.94rem; font-weight: 700; padding: 8px 16px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.22s ease; }
.seg-btn:hover { color: var(--text-main); }
.seg-btn.active { background: var(--accent); color: #ffffff; box-shadow: 0 3px 10px rgba(22, 125, 141, 0.28); }
html[data-theme="night"] .seg-btn.active { color: #062129; }
.theme-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text-main); font-family: inherit; font-size: 0.94rem; font-weight: 700; padding: 9px 16px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); transition: transform 0.18s ease, border-color 0.2s ease; }
.theme-btn:hover { transform: translateY(-1px); border-color: var(--border-strong); }
.notion-home-btn { text-decoration: none; font-size: 0.94rem; font-weight: 700; padding: 10px 18px; border-radius: 999px; background: var(--warm); color: #ffffff; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(217, 119, 54, 0.25); transition: transform 0.18s ease, filter 0.2s ease; }
.notion-home-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
html[data-theme="night"] .notion-home-btn { color: #1f1307; }

.mode-banner { position: relative; z-index: 10; max-width: 1320px; margin: 10px auto 18px; padding: 0 24px; }
.banner-inner { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; box-shadow: var(--shadow-sm); }
.banner-tag { font-size: 0.9rem; font-weight: 800; padding: 5px 14px; border-radius: 999px; background: var(--green-soft); color: var(--green); white-space: nowrap; }
html[data-mode="pro"] .banner-tag { background: var(--purple-soft); color: var(--purple); }
.banner-inner p { font-size: 0.98rem; color: var(--text-muted); flex: 1; }
.stepper { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.step-pill { border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-family: inherit; font-size: 0.92rem; font-weight: 700; padding: 8px 15px; border-radius: 999px; cursor: pointer; transition: all 0.2s ease; }
.step-pill:hover { border-color: var(--accent); color: var(--text-main); }
.step-pill.active { background: var(--warm); border-color: var(--warm); color: #ffffff; }
html[data-theme="night"] .step-pill.active { color: #1f1307; }
.step-arrow { color: var(--text-soft); font-weight: 700; font-size: 0.95rem; }

.main-layout { position: relative; z-index: 10; max-width: 1320px; margin: 0 auto; padding: 0 24px 40px; display: grid; grid-template-columns: minmax(360px, 0.98fr) minmax(380px, 1.22fr); gap: 24px; align-items: start; }
.map-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-md); position: sticky; top: 18px; }
.map-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.map-header h2 { font-size: 1.15rem; font-weight: 800; }
.map-hint { font-size: 0.88rem; color: var(--text-muted); }
.map-legend { display: flex; gap: 12px; font-size: 0.84rem; color: var(--text-muted); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot-route { background: var(--route-color); }
.dot-relation { background: var(--relation-color); }
.pro-only { display: none; }
html[data-mode="pro"] .pro-only { display: inline-flex; }

.svg-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; padding: 6px 0; }
#taiwanMap { width: 100%; max-width: 470px; height: auto; overflow: visible; color: var(--accent); }
.taiwan-land { fill: var(--island-fill); stroke: var(--island-stroke); stroke-width: 2.3; transition: fill 0.4s ease, stroke 0.4s ease; }
html[data-theme="night"] .taiwan-land { filter: url(#glow); }
.coast-ripple { stroke: var(--coast-stroke); animation: dashMove 26s linear infinite; }
.mountain-ridge { stroke: var(--mountain-stroke); }
.region-label { font-size: 12.5px; font-weight: 700; fill: rgba(255, 255, 255, 0.88); pointer-events: none; }
html[data-theme="night"] .region-label { fill: rgba(173, 238, 245, 0.85); }
.route-path { stroke: var(--route-color); stroke-width: 3.2; stroke-dasharray: 7 6; animation: dashMove 12s linear infinite; }
.route-arrow-fill { fill: var(--route-color); }
@keyframes dashMove { to { stroke-dashoffset: -120; } }
.relation-lines { opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
html[data-mode="pro"] .relation-lines { opacity: 1; }
.relation-path { stroke: var(--relation-color); stroke-width: 2.8; stroke-dasharray: 4 4; }
.relation-arrow-fill { fill: var(--relation-color); }
.relation-pill-bg { fill: var(--surface-strong); stroke: var(--relation-color); stroke-width: 1.5; }
.relation-pill-text { font-size: 11.5px; font-weight: 800; fill: var(--relation-color); }

.station-node { cursor: pointer; outline: none; }
.station-node .pulse-ring { fill: var(--warm); opacity: 0; transform-origin: center; }
.station-node.active .pulse-ring { animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { opacity: 0.45; transform: scale(0.95); } 100% { opacity: 0; transform: scale(1.75); } }
.station-node .node-bg { fill: var(--node-bg); stroke: var(--node-border); stroke-width: 3; transition: all 0.22s ease; }
.station-node .node-bg-alt { stroke-dasharray: 4 2; }
.station-node:hover .node-bg, .station-node:focus-visible .node-bg { stroke-width: 4; transform: scale(1.07); }
.station-node.active .node-bg { fill: var(--node-active-bg); stroke: var(--node-active-border); stroke-width: 4; }
.station-node .node-emoji { font-size: 21px; pointer-events: none; }
.node-badge circle { fill: var(--accent); }
.station-node.active .node-badge circle { fill: var(--warm); }
.node-badge text { fill: #ffffff; font-size: 12.5px; font-weight: 900; }
.node-label-box rect { fill: var(--label-bg); stroke: var(--border-strong); stroke-width: 1.4; }
.station-node.active .node-label-box rect { stroke: var(--warm); stroke-width: 2.2; }
.node-label-box text { fill: var(--label-text); font-size: 14px; font-weight: 800; }

.rhythm-strip { margin-top: 12px; padding: 14px 16px; border-radius: var(--radius-md); background: var(--surface-soft); border: 1px solid var(--border); text-align: center; }
.rhythm-title { font-size: 0.86rem; font-weight: 700; color: var(--text-soft); margin-bottom: 4px; }
.rhythm-flow { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.98rem; font-weight: 800; color: var(--accent); }
.rhythm-flow i { font-style: normal; color: var(--text-soft); }

.detail-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 26px; box-shadow: var(--shadow-md); animation: fadeUp 0.25s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.station-kicker { display: inline-flex; align-items: center; font-size: 0.88rem; font-weight: 800; color: var(--warm); background: var(--warm-soft); padding: 4px 12px; border-radius: 999px; margin-bottom: 8px; }
.panel-head h2 { font-size: 1.52rem; font-weight: 900; line-height: 1.3; }
.panel-subtitle { font-size: 1rem; color: var(--text-muted); margin-top: 6px; }
.primary-cta { text-decoration: none; display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 12px; background: var(--accent); color: #ffffff; font-size: 0.96rem; font-weight: 800; white-space: nowrap; box-shadow: 0 4px 12px rgba(22, 125, 141, 0.24); transition: transform 0.18s ease, background 0.2s ease; }
.primary-cta:hover { transform: translateY(-1px); background: var(--accent-hover); }
html[data-theme="night"] .primary-cta { color: #062129; }

.section-block { margin-bottom: 22px; }
.section-block:last-child { margin-bottom: 0; }
.section-label { font-size: 0.98rem; font-weight: 800; color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.steps-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
.step-card { display: flex; gap: 14px; padding: 14px 16px; border-radius: var(--radius-md); background: var(--surface-soft); border: 1px solid var(--border); align-items: flex-start; }
.step-num { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #ffffff; font-size: 0.92rem; font-weight: 900; display: grid; place-items: center; flex-shrink: 0; margin-top: 2px; }
html[data-theme="night"] .step-num { color: #062129; }
.step-body strong { display: block; font-size: 1.04rem; margin-bottom: 3px; }
.step-body p { font-size: 0.95rem; color: var(--text-muted); }

.links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.notion-link-card { text-decoration: none; color: var(--text-main); padding: 14px 16px; border-radius: var(--radius-md); background: var(--surface-strong); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; transition: all 0.2s ease; }
.notion-link-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.link-top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 1rem; }
.link-top .ext { color: var(--accent); font-size: 0.95rem; }
.link-desc { font-size: 0.88rem; color: var(--text-muted); }

.tip-box { padding: 14px 18px; border-radius: var(--radius-md); background: var(--warm-soft); border-left: 4px solid var(--warm); font-size: 0.96rem; color: var(--text-main); }
.arch-text { font-size: 0.98rem; color: var(--text-muted); }

.schema-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border); }
.schema-table th, .schema-table td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--border); }
.schema-table th { background: var(--surface-soft); color: var(--text-muted); font-weight: 800; font-size: 0.86rem; }
.schema-table tr:last-child td { border-bottom: none; }
.type-badge { display: inline-block; font-size: 0.82rem; font-weight: 700; padding: 3px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.type-badge.relation { background: var(--purple-soft); color: var(--purple); }
.type-badge.formula { background: var(--warm-soft); color: var(--warm); }

.hours-bar { display: flex; height: 20px; border-radius: 999px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--border); }
.hours-legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; font-size: 0.9rem; }
.hour-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; background: var(--surface-soft); }
.hour-swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }

.panel-nav { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.nav-btn { border: 1px solid var(--border); background: var(--surface-strong); color: var(--text-main); font-family: inherit; font-size: 0.94rem; font-weight: 700; padding: 10px 16px; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; }
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }

.footer { position: relative; z-index: 10; text-align: center; padding: 10px 24px 30px; font-size: 0.9rem; color: var(--text-soft); }
.footer a { color: var(--accent); text-decoration: none; font-weight: 700; }
.footer a:hover { text-decoration: underline; }

@media (max-width: 960px) { .main-layout { grid-template-columns: 1fr; } .map-card { position: static; } }
@media (max-width: 540px) { html { font-size: 17px; } .topbar { padding: 14px 16px 8px; } .mode-banner, .main-layout { padding-left: 16px; padding-right: 16px; } .detail-panel { padding: 18px; } }
  </style>
</head>
<body>
  <div class="ocean-bg" aria-hidden="true">
    <div class="stars" id="stars"></div>
    <div class="wave wave-1"></div>
    <div class="wave wave-2"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">🏝️</div>
      <div class="brand-text">
        <h1>島先生的時間管理日記</h1>
        <p class="brand-sub">台灣島互動操作導覽</p>
      </div>
    </div>

    <div class="controls">
      <div class="segmented-control" role="group" aria-label="切換閱讀版本">
        <button id="btnBeginner" class="seg-btn active" data-mode="beginner"><span>🌱</span><span>初學者</span></button>
        <button id="btnPro" class="seg-btn" data-mode="pro"><span>🧭</span><span>老鳥模式</span></button>
      </div>
      <button id="themeToggle" class="theme-btn" aria-label="切換白天或夜間模式">
        <span id="themeIcon">☀️</span><span id="themeLabel">白天</span>
      </button>
      <a href="https://app.notion.com/p/3-54a3dd902f7e83fcb38e01f32885689d" target="_blank" rel="noopener noreferrer" class="notion-home-btn">
        <span>開啟 Notion 主頁 ↗</span>
      </a>
    </div>
  </header>

  <section class="mode-banner" id="modeBanner">
    <div class="banner-inner">
      <span class="banner-tag" id="bannerTag">🌱 初學者導覽</span>
      <p id="bannerDesc">照著台灣島 <strong>1 → 2 → 3 → 4</strong> 點擊，就能看懂每天怎麼用，並直達對應 Notion 欄位。</p>
    </div>
    <div class="stepper" id="beginnerStepper">
      <button class="step-pill active" data-station="inbox">1. 速記區</button>
      <span class="step-arrow">→</span>
      <button class="step-pill" data-station="tasks">2. 任務管理</button>
      <span class="step-arrow">→</span>
      <button class="step-pill" data-station="focus">3. 專注時光</button>
      <span class="step-arrow">→</span>
      <button class="step-pill" data-station="journal">4. TTL 日記</button>
      <span class="step-arrow">·</span>
      <button class="step-pill" data-station="persona">🏝️ 島先生</button>
    </div>
  </section>

  <main class="main-layout">
    <section class="map-card" aria-label="台灣島互動導覽地圖">
      <div class="map-header">
        <div>
          <h2 id="mapTitle">🗺️ 台灣島環島地圖</h2>
          <p class="map-hint" id="mapHint">點擊島上地標，查看教學與連結</p>
        </div>
        <div class="map-legend">
          <span class="legend-item"><i class="dot dot-route"></i> 每日動線</span>
          <span class="legend-item pro-only"><i class="dot dot-relation"></i> 資料庫關聯</span>
        </div>
      </div>

      <div class="svg-wrapper">
        <svg id="taiwanMap" viewBox="0 0 460 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="台灣島時間管理互動地圖">
          <defs>
            <linearGradient id="islandGradDay" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8fd9a8" />
              <stop offset="50%" stop-color="#52b788" />
              <stop offset="100%" stop-color="#2d6a4f" />
            </linearGradient>
            <linearGradient id="islandGradNight" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1e4d5c" />
              <stop offset="50%" stop-color="#143642" />

const bannerDesc = document.getElementById("bannerDesc");
const mapTitle = document.getElementById("mapTitle");
const mapHint = document.getElementById("mapHint");
const stationNodes = document.querySelectorAll(".station-node");
const stepPills = document.querySelectorAll(".step-pill");

function initStars() {
  const container = document.getElementById("stars");
  if (!container) return;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 48; i++) {
    const s = document.createElement("span");
    s.className = "star";
    const size = Math.random() * 2.4 + 1.2;
    s.style.width = `${size}px`; s.style.height = `${size}px`;
    s.style.left = `${Math.random() * 100}%`; s.style.top = `${Math.random() * 75}%`;
    s.style.animationDelay = `${(Math.random() * 3.5).toFixed(2)}s`;
    frag.appendChild(s);
  }
  container.appendChild(frag);
}

function applyTheme(theme) {
  state.theme = theme;
  htmlEl.setAttribute("data-theme", theme);
  localStorage.setItem("mr_island_theme", theme);
  themeIcon.textContent = theme === "night" ? "🌙" : "☀️";
  themeLabel.textContent = theme === "night" ? "夜間" : "白天";
}

function applyMode(mode) {
  state.mode = mode;
  htmlEl.setAttribute("data-mode", mode);
  localStorage.setItem("mr_island_mode", mode);
  btnBeginner.classList.toggle("active", mode === "beginner");
  btnPro.classList.toggle("active", mode === "pro");
  if (mode === "beginner") {
    bannerTag.textContent = "🌱 初學者導覽";
    bannerDesc.innerHTML = "照著台灣島 <strong>1 → 2 → 3 → 4</strong> 點擊，就能看懂每天怎麼用，並直達對應 Notion 欄位。";
    mapTitle.textContent = "🗺️ 台灣島環島地圖";
    mapHint.textContent = "點擊島上地標，查看教學與連結";
  } else {
    bannerTag.textContent = "🧭 老鳥架構模式";
    bannerDesc.innerHTML = "顯示 <strong>資料庫關聯 (Relation)</strong>、完整屬性欄位表，以及底層原始資料庫入口。";
    mapTitle.textContent = "🗺️ 台灣島系統架構圖";
    mapHint.textContent = "紫色虛線為資料庫雙向關聯與按鈕觸發";
  }
  renderDetail();
}

function selectStation(stationId) {
  if (!STATIONS[stationId]) return;
  state.station = stationId;
  stationNodes.forEach((node) => node.classList.toggle("active", node.dataset.station === stationId));
  stepPills.forEach((pill) => pill.classList.toggle("active", pill.dataset.station === stationId));
  renderDetail();
}

function buildHoursBarHtml() {
  const segments = [
    { label: "深度工作 4h", pct: (4 / 24) * 100, color: "#167d8d" },
    { label: "行政溝通 2h", pct: (2 / 24) * 100, color: "#54a6a3" },
    { label: "學習 2h", pct: (2 / 24) * 100, color: "#2d8a61" },
    { label: "回顧 1h", pct: (1 / 24) * 100, color: "#d97736" },
    { label: "生活休息 7h", pct: (7 / 24) * 100, color: "#e9b872" },
    { label: "睡眠 8h", pct: (8 / 24) * 100, color: "#6b52ae" },
  ];
  const barSpans = segments.map((seg) => `<span style="width:${seg.pct.toFixed(2)}%;background:${seg.color};" title="${seg.label}"></span>`).join("");
  const legendItems = segments.map((seg) => `<div class="hour-item"><span class="hour-swatch" style="background:${seg.color};"></span><span>${seg.label}</span></div>`).join("");
  return `<div class="section-block"><div class="section-label">⏳ 島先生的一天（24 小時）</div><div class="hours-bar">${barSpans}</div><div class="hours-legend">${legendItems}</div></div>`;
}

function renderDetail() {
  const data = STATIONS[state.station];
  const isPro = state.mode === "pro";
  const currentIdx = STATION_ORDER.indexOf(state.station);
  const prevId = STATION_ORDER[(currentIdx - 1 + STATION_ORDER.length) % STATION_ORDER.length];
  const nextId = STATION_ORDER[(currentIdx + 1) % STATION_ORDER.length];

  const visibleLinks = data.links.filter((link) => isPro || !link.proOnly);
  const linksHtml = visibleLinks.map((link) => `
      <a class="notion-link-card" href="${link.url}" target="_blank" rel="noopener noreferrer">
        <div class="link-top"><span>${link.title}</span><span class="ext" aria-hidden="true">↗</span></div>
        <span class="link-desc">${link.desc}</span>
      </a>`).join("");

  let coreSectionHtml = "";
  if (!isPro) {
    const stepsHtml = data.beginner.steps.map((step, idx) => `
        <li class="step-card">
          <span class="step-num">${idx + 1}</span>
          <div class="step-body"><strong>${step.title}</strong><p>${step.desc}</p></div>
        </li>`).join("");
    coreSectionHtml = `
      <div class="section-block"><div class="section-label">🌱 簡單 3 步驟</div><ol class="steps-list">${stepsHtml}</ol></div>
      ${data.showHoursBar ? buildHoursBarHtml() : ""}
      <div class="section-block"><div class="tip-box">${data.beginner.tip}</div></div>`;
  } else {
    const schemaRows = data.pro.schema.map((col) => `
        <tr><td><strong>${col.name}</strong></td><td><span class="type-badge ${col.badgeClass || ""}">${col.type}</span></td><td>${col.desc}</td></tr>`).join("");
    coreSectionHtml = `
      <div class="section-block"><div class="section-label">🧭 設計重點</div><p class="arch-text">${data.pro.architecture}</p></div>
      ${data.showHoursBar ? buildHoursBarHtml() : ""}
      <div class="section-block"><div class="section-label">🗂️ 主要欄位對照</div>
        <table class="schema-table"><thead><tr><th>欄位</th><th>類型</th><th>用途</th></tr></thead><tbody>${schemaRows}</tbody></table>
      </div>
      <div class="section-block"><div class="tip-box">${data.pro.proTip}</div></div>`;
  }

  detailPanel.innerHTML = `
    <div class="panel-head">
      <div><div class="station-kicker">${data.kicker}</div><h2>${data.title}</h2><p class="panel-subtitle">${data.subtitle}</p></div>
      <a class="primary-cta" href="${data.primaryCta.url}" target="_blank" rel="noopener noreferrer"><span>${data.primaryCta.label} ↗</span></a>
    </div>
    ${coreSectionHtml}
    <div class="section-block"><div class="section-label">🔗 直達對應 Notion 欄位</div><div class="links-grid">${linksHtml}</div></div>
    <div class="panel-nav">
      <button class="nav-btn" id="prevStationBtn">← ${STATIONS[prevId].title}</button>
      <button class="nav-btn" id="nextStationBtn">${STATIONS[nextId].title} →</button>
    </div>`;

  document.getElementById("prevStationBtn").addEventListener("click", () => selectStation(prevId));
  document.getElementById("nextStationBtn").addEventListener("click", () => selectStation(nextId));
}

btnBeginner.addEventListener("click", () => applyMode("beginner"));
btnPro.addEventListener("click", () => applyMode("pro"));
themeToggle.addEventListener("click", () => applyTheme(state.theme === "day" ? "night" : "day"));
stationNodes.forEach((node) => {
  node.addEventListener("click", () => selectStation(node.dataset.station));
  node.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectStation(node.dataset.station); } });
});
stepPills.forEach((pill) => pill.addEventListener("click", () => selectStation(pill.dataset.station)));

initStars();
applyTheme(state.theme);
applyMode(state.mode);
selectStation("inbox");
  </script>
</body>
</html>
